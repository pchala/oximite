[package]
name = "oximite-proto"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
std = ["serde/std"]

[dependencies]
heapless = { version = "0.9.2", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

[dev-dependencies]
serde_json = "1"
