[package]
name = "oximite-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
oximite-proto = { path = "../proto", features = ["std"] }
heapless = { version = "0.9.2", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde-json-core = "0.6.0"

[dev-dependencies]
serde_json = "1"

[workspace]
